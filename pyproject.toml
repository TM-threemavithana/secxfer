[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secxfer"
version = "0.1.0"
description = "Cryptographically secure file transfer library using pre-shared keys"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyNaCl>=1.5.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pip-tools>=7.0.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "httpx[socks]>=0.24.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]
ux = [
    "segno>=1.5.0",
]

[project.scripts]
secxfer = "secxfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secxfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
