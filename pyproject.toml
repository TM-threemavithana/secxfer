[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secxfer"
version = "0.1.0"
description = "Cryptographically secure file transfer library using pre-shared keys"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
secxfer = "secxfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secxfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
